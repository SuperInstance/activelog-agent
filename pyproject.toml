[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "activelog-agent"
version = "0.3.0"
description = "Autonomous log monitoring and alerting agent"
requires-python = ">=3.10"
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=7.0"]

[project.urls]
Homepage = "https://github.com/SuperInstance/activelog-agent"

[tool.setuptools]
packages = ["activelog_agent"]

[tool.pytest.ini_options]
testpaths = ["tests"]
